name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Production's major version (Neon, 18). Local development runs 17, so
        # this job is the automated environment that matches production.
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dailyintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:4610
      # The suite connects as the runtime role; its global setup creates that
      # role and applies the migrations as the owner. The container trusts local
      # connections, so neither URL carries a password.
      DATABASE_URL_TEST: postgresql://di_app@localhost:5432/dailyintel_test
      DATABASE_URL_TEST_OWNER: postgresql://postgres@localhost:5432/dailyintel_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The IDENTICAL command to the local gate. If CI ran a different set, the
      # local gate would be theatre and the real one a surprise.
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

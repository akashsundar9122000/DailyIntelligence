name: Tick

# Reads every due source, clusters and scores, every fifteen minutes; then
# runs the AI pass (explainers and the edition briefing) and the notification
# pass, each as its own request, so a slow step never eats into the next one's
# time.
#
# GitHub may start a scheduled run 5-20 minutes late under load; the paper
# shows real freshness times, so lateness is visible rather than hidden, and
# Vercel's daily cron is the backstop. The endpoint does the work within its
# own time budget; this job only knocks on the door and reports what came back.
#
# Needs repository secrets TICK_URL (the production origin) and CRON_SECRET.
# Without them it fails loudly rather than appearing to run.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the tick endpoint
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'github' }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::TICK_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" -H "x-trigger: $TRIGGER" "$TICK_URL/api/cron/tick")
          # The summary names sources and counts only; no secret or content is in it. A
          # failure page is cut short: the status line below is what matters.
          head -c 2000 response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::The tick answered $status."
            exit 1
          fi
      - name: Call the AI pass
        # Runs even when the tick failed: explainers for the stories already held are still worth writing.
        if: always()
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'github' }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::TICK_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" -H "x-trigger: $TRIGGER" "$TICK_URL/api/cron/enrich")
          # Counts only: no story text, no model output.
          head -c 600 response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::The AI pass answered $status."
            exit 1
          fi
      - name: Call the notification pass
        # After the AI pass, so a scheduled briefing goes out with the newest edition.
        if: always()
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'github' }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::TICK_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" -H "x-trigger: $TRIGGER" "$TICK_URL/api/cron/notify")
          # Counts only: no reader, no address, no story text.
          head -c 600 response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::The notification pass answered $status."
            exit 1
          fi
